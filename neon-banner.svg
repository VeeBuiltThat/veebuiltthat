<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff00cc"/>
      <stop offset="50%" stop-color="#7a00ff"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#17122b"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#00e5ff" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#080a0f"/>
  <rect x="18" y="18" width="1164" height="384" rx="18" fill="url(#glow)" stroke="url(#border)" stroke-width="5"/>
  <rect x="20" y="20" width="1160" height="380" rx="16" fill="url(#grid)"/>

  <circle cx="180" cy="205" r="108" fill="none" stroke="#ff00cc" stroke-width="3" opacity=".55"/>
  <circle cx="180" cy="205" r="82" fill="none" stroke="#00e5ff" stroke-width="2" opacity=".45"/>
  <path d="M120 250 L180 125 L240 250 Z" fill="none" stroke="url(#border)" stroke-width="5" filter="url(#softGlow)"/>
  <circle cx="180" cy="205" r="17" fill="#00e5ff" filter="url(#softGlow)"/>

  <text x="340" y="175" fill="#ffffff" font-family="monospace" font-size="64" font-weight="700" letter-spacing="3">
    YOUR NAME
  </text>
  <text x="344" y="228" fill="#ff00cc" font-family="monospace" font-size="26" font-weight="700" letter-spacing="5">
    ARTIST // DEVELOPER
  </text>
  <text x="344" y="282" fill="#00e5ff" font-family="monospace" font-size="21" letter-spacing="2">
    MAKING STRANGE + BEAUTIFUL THINGS
  </text>

  <g opacity=".7">
    <rect x="1000" y="112" width="88" height="8" fill="#ff00cc"/>
    <rect x="1032" y="132" width="88" height="8" fill="#00e5ff"/>
    <rect x="980" y="152" width="88" height="8" fill="#7a00ff"/>
  </g>
</svg>
